name: Deploy to Oracle

on:
  push:
    branches: [main]
    paths:
      - 'app/server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 84.235.252.212
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/portal
            mkdir -p ~/backups && cp app/server/data/db.json ~/backups/db-$(date -u +%Y%m%d-%H%M%S)-predeploy.json
            find ~/backups -name "db-*-predeploy.json" -mtime +14 -delete
            git pull --ff-only origin main
            git log --oneline -1
            pm2 restart portal-backend --update-env
            echo "Deploy complete"
