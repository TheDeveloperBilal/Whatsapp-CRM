app = 'whatsapp-portal'
primary_region = 'dxb'

[build]

[env]
  NODE_ENV = 'production'
  PORTAL_PORT = '8787'
  DATA_DIR = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'portal_data'
  destination = '/data'
  initial_size = '3gb'
