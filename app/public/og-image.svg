<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B1120"/>
  <!-- Subtle dot grid -->
  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Emerald glow -->
  <radialGradient id="glow" cx="75%" cy="30%" r="40%">
    <stop offset="0%" stop-color="#0C9A68" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0C9A68" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand icon -->
  <rect x="88" y="220" width="64" height="64" rx="16" fill="#0C9A68"/>
  <path d="M102 271v-19a6 6 0 0 1 6-6h12a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6h-10l-8 4v-3z" fill="white"/>
  <circle cx="116" cy="259" r="2.4" fill="#0C9A68"/>
  <circle cx="124" cy="259" r="2.4" fill="#0C9A68"/>

  <!-- Company name -->
  <text x="172" y="252" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="20" fill="white" opacity="0.7">Digital Nova Tech</text>
  <text x="172" y="276" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="14" fill="#0C9A68" letter-spacing="2">WHATSAPP PORTAL</text>

  <!-- Main headline -->
  <text x="88" y="360" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="64" fill="white" letter-spacing="-2">One platform.</text>
  <text x="88" y="438" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="64" fill="#0C9A68" letter-spacing="-2">Every WhatsApp</text>
  <text x="88" y="516" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="64" fill="white" letter-spacing="-2">conversation.</text>

  <!-- Right side stats -->
  <rect x="840" y="200" width="280" height="80" rx="16" fill="rgba(12,154,104,0.1)" stroke="#0C9A68" stroke-width="1" stroke-opacity="0.3"/>
  <text x="980" y="248" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="36" fill="white" text-anchor="middle">15</text>
  <text x="980" y="268" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">Built-in features</text>

  <rect x="840" y="300" width="280" height="80" rx="16" fill="rgba(184,123,32,0.1)" stroke="#B87B20" stroke-width="1" stroke-opacity="0.3"/>
  <text x="980" y="348" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="36" fill="white" text-anchor="middle">$0</text>
  <text x="980" y="368" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">Per-seat fee</text>

  <rect x="840" y="400" width="280" height="80" rx="16" fill="rgba(12,154,104,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="980" y="448" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="36" fill="white" text-anchor="middle">&lt; 1hr</text>
  <text x="980" y="468" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="13" fill="rgba(255,255,255,0.5)" text-anchor="middle">Setup time</text>

  <!-- URL -->
  <text x="88" y="590" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="16" fill="rgba(255,255,255,0.25)">digitalnovatech.com</text>
</svg>
